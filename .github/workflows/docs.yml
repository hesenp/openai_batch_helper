name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]
          pip install -r doc/requirements.txt

      - name: Build docs locally
        run: sphinx-build -W -b html doc/ doc/_build/html

      - name: Trigger Read the Docs build
        uses: readthedocs/action@v1
        with:
          token: ${{ secrets.RTD_TOKEN }}
          project: openai-batch-helper
          version: latest
